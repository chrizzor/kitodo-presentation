<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="module-body t3js-module-body">

    <h1><f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.module" /></h1>

    <f:flashMessages />

    <f:if condition="{hasRulesetPath}">
        <f:if condition="{keys}">
            <p class="text-muted mb-3">
                <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.intro" />
            </p>

            <div class="mb-3 text-muted small">
                <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.rulesetPathInfo" />
                <code>{rulesetPath}</code>
            </div>

            <f:if condition="{xsltPath}">
                <div class="mb-3 text-muted small">
                    <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.xsltPathInfo" />
                    <code>{xsltPath}</code>
                </div>
            </f:if>

            <f:form action="save" method="post" id="rulesetSelectForm">

                <div class="row mb-3 align-items-end">
                    <div class="col-md-3">
                        <label for="labelLang" class="form-label">
                            <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.labelLangLabel" />
                        </label>
                        <select id="labelLang" name="labelLang" class="form-select form-select-sm">
                            <f:if condition="{preferredLang} == 'de'">
                                <f:then>
                                    <option value="de" selected="selected">Deutsch</option>
                                    <option value="en">English</option>
                                </f:then>
                                <f:else>
                                    <option value="de">Deutsch</option>
                                    <option value="en" selected="selected">English</option>
                                </f:else>
                            </f:if>
                        </select>
                        <div class="form-text">
                            <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.labelLangHelp" />
                        </div>
                    </div>
                    <div class="col-md-auto">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="selectAllBtn">
                                <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.selectAll" />
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="deselectAllBtn">
                                <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.deselectAll" />
                            </button>
                        </div>
                    </div>
                </div>

                <table class="table table-striped table-hover table-sm">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 40px;"></th>
                            <th><f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.keyId" /></th>
                            <th><f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.labelDe" /></th>
                            <th><f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.labelEn" /></th>
                            <th><f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.status" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{keys}" as="key" key="keyId">
                            <tr>
                                <td class="text-center">
                                    <f:form.checkbox
                                        name="selectedKeys[]"
                                        value="{key.id}"
                                        checked="{key.isChecked}"
                                        class="ruleset-key-checkbox"
                                        id="key_{key.id}" />
                                </td>
                                <td>
                                    <label for="key_{key.id}" class="font-monospace mb-0 fw-bold">{key.id}</label>
                                    <f:if condition="{key.use}">
                                        <span class="badge bg-secondary ms-1">
                                            <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.use.{key.use}" default="{key.use}" />
                                        </span>
                                    </f:if>
                                    <f:if condition="{key.xpath}">
                                        <div class="text-muted font-monospace mt-1" style="font-size: 0.75em;">
                                            {key.xpath}
                                            <f:if condition="{key.xpathFromXslt}">
                                                <f:then><span class="text-success">(<f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.xpathDerived" />)</span></f:then>
                                                <f:else><span class="text-secondary">(<f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.xpathFallback" />)</span></f:else>
                                            </f:if>
                                        </div>
                                    </f:if>
                                </td>
                                <td>
                                    <label for="key_{key.id}" class="mb-0">{key.labels.de}</label>
                                </td>
                                <td>
                                    <label for="key_{key.id}" class="mb-0 text-muted">{key.labels.en}</label>
                                </td>
                                <td>
                                    <f:if condition="{key.dbStatus} == 'active'">
                                        <span class="badge bg-success">
                                            <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.status.active" />
                                        </span>
                                    </f:if>
                                    <f:if condition="{key.dbStatus} == 'hidden'">
                                        <span class="badge bg-warning text-dark">
                                            <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.status.hidden" />
                                        </span>
                                    </f:if>
                                    <f:if condition="{key.dbStatus} == 'new'">
                                        <span class="badge bg-secondary">
                                            <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.status.new" />
                                        </span>
                                    </f:if>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <f:translate key="LLL:EXT:dlf/Resources/Private/Language/locallang_mod_rulesetimport.xlf:rulesetImport.saveBtn" />
                    </button>
                </div>

            </f:form>
        </f:if>
    </f:if>

</div>

<script>
(function () {
    var selectAllBtn = document.getElementById('selectAllBtn');
    var deselectAllBtn = document.getElementById('deselectAllBtn');
    if (selectAllBtn) {
        selectAllBtn.addEventListener('click', function () {
            document.querySelectorAll('.ruleset-key-checkbox').forEach(function (cb) { cb.checked = true; });
        });
    }
    if (deselectAllBtn) {
        deselectAllBtn.addEventListener('click', function () {
            document.querySelectorAll('.ruleset-key-checkbox').forEach(function (cb) { cb.checked = false; });
        });
    }
}());
</script>

</html>
